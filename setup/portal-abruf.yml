name: Portaldaten abrufen

# Holt alle 3 Stunden die öffentlichen Bekanntmachungen und legt sie als docs/data/tenders.json ab.
# GitHub Pages (Branch main, Ordner /docs) veröffentlicht die Datei danach automatisch.
on:
  schedule:
    # alle 3 Stunden (UTC), Minute 7 um Lastspitzen zu meiden
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: portaldaten
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Öffentliche Ausschreibungen abrufen (Portal-Adapter)
        run: node sync/fetch-tenders.mjs docs/data/tenders.json https://networker-vt.github.io/nexus-web/data/tenders.json

      - name: Datei veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/tenders.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git commit -m "Portaldaten $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
